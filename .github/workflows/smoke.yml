name: Trends integration
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: |
          go -C apps/api test ./...
          python -m unittest discover -s services/data-pipeline -v
      - name: Build and start the full stack
        run: docker compose up --build -d
      - name: Verify API and browser journey
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python tests/smoke.py
      - name: Confirm a repeat ingestion creates no duplicate observations
        run: |
          docker compose exec -T app /opt/venv/bin/python /app/services/data-pipeline/ingest.py
          test "$(docker compose exec -T db psql -U trends -d trends -Atc 'SELECT observations_written FROM data_ingestion_runs ORDER BY id DESC LIMIT 1')" = 0
      - name: Print service logs on failure
        if: failure()
        run: docker compose logs --no-color
