services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: trends
      POSTGRES_USER: trends
      POSTGRES_PASSWORD: trends-local-only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trends -d trends"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://trends:trends-local-only@db:5432/trends
    ports:
      - "127.0.0.1:${TRENDS_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
