services:
  - type: web
    name: trends-web
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trends-db
          property: connectionString
databases:
  - name: trends-db
    databaseName: trends
    plan: free
    region: singapore
    postgresMajorVersion: "17"
    ipAllowList: []
